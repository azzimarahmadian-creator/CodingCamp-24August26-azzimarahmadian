<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="dashboard-container">
        <!-- Widget 1: Greeting -->
        <header class="card header-card">
            <time class="time-display" id="clock">10:45:22</time>
            <p class="date-display" id="date">Rabu, 26 Agustus 2026</p>
            <h1 class="greeting-display" id="greeting">Selamat Pagi</h1>
        </header>

         <!-- Widget 2: Focus Timer -->
        <section class="card timer-card">
            <h2 class="widget-title">Focus Timer</h2>
            <div class="timer-clock" id="timerDisplay">25:00</div>
            <nav class="btn-group" aria-label="Timer Controls">
                <button class="btn-primary" id="startBtn">Mulai</button>
                <button class="btn-secondary" id="stopBtn">Berhenti</button>
                <button class="btn-secondary" id="resetBtn">Reset</button>
            </nav>
        </section>

        <!-- Widget 3: Todo List -->
        <section class="card">
            <h2 class="widget-title">Daftar Tugas</h2>
            <div class="task-input-group">
                <input type="text" id="taskInput" placeholder="Tambah tugas baru...">
                <button class="btn-primary" id="addTaskBtn">Tambah</button>
            </div>
            <ul class="task-list" id="taskList"></ul>
        </section>

        <!-- Widget 4: Quick Links -->
        <section class="card quick-links-card">
            <h2 class="widget-title">Tautan Cepat</h2>
            <form class="link-form" onsubmit="event.preventDefault();">
                <input type="text" id="linkNameInput" placeholder="Nama tautan" style="flex: 1;">
                <input type="text" id="linkUrlInput" placeholder="URL (cth. https://google.com)" style="flex: 2;">
                <button class="btn-primary" id="addLinkBtn">Tambah Tautan</button>
            </form>
            <nav class="links-container" id="linksContainer" aria-label="Quick Links"></nav>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
